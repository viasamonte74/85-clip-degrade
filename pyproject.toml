[project]
name = "sn85ds"
version = "0.1.0"
description = "Licensed 1080p reference collection and two-stage degradation pipeline for SN85 competition sn85-upscaling-006 (data engineering only)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.0",
  "opencv-python-headless>=4.10",
  "scipy>=1.13",
  "pydantic>=2.7",
  "pandas>=2.2",
  "pyarrow>=16",
  "pyyaml>=6",
  "pillow>=10",
]

[project.optional-dependencies]
screen = ["playwright>=1.45"]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
